name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore wordgame.sln

      # Includes the Godot UI project: Godot.NET.Sdk restores from nuget.org, so it compiles without Godot itself.
      - name: Build
        run: dotnet build wordgame.sln -c Release --no-restore

      - name: Test
        run: dotnet test wordgame.sln -c Release --no-build
